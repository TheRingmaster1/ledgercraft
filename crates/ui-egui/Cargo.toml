[package]
name = "ledgercraft-ui-egui"
description = "L4 of LedgerCraft: the desktop interface (egui). Swappable: it only reads engine state and runs commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ledgercraft-core.workspace = true
ledgercraft-ledger.workspace = true
ledgercraft-reports.workspace = true
ledgercraft-file.workspace = true
ledgercraft-engine.workspace = true
eframe.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize = "1"
# Password strength estimate (Dropbox's zxcvbn, ported to Rust). MIT.
zxcvbn = "3"
# Checks an installed font file is readable before egui is given it (egui
# itself uses this crate to read fonts). MIT OR Apache-2.0.
ab_glyph = "0.2"

[lints]
workspace = true
