[workspace]
resolver = "2"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["apps/ledgercraft", "apps/ledgercraft-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Jeffrey Parke and the LedgerCraft contributors"]
repository = "https://github.com/TheRingmaster1/ledgercraft"
homepage = "https://github.com/TheRingmaster1/ledgercraft"
keywords = ["accounting", "bookkeeping", "ledger", "invoicing", "small-business"]
categories = ["finance"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# glow (OpenGL) is compiled in by default but crashes on Windows in glutin 0.32 (WGL
# config query violates Vec::set_len); the app selects the wgpu renderer instead.
eframe = { version = "0.29", features = ["wgpu"] }
rfd = "0.15"
# Writes formatted .xlsx report exports. MIT OR Apache-2.0, like LedgerCraft.
rust_xlsxwriter = "0.100"

ledgercraft-core = { path = "crates/core" }
ledgercraft-ledger = { path = "crates/ledger" }
ledgercraft-reports = { path = "crates/reports" }
ledgercraft-file = { path = "crates/file" }
ledgercraft-engine = { path = "crates/engine" }
ledgercraft-ui-egui = { path = "crates/ui-egui" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
