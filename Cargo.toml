[workspace]
resolver = "2"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["apps/ledgercraft", "apps/ledgercraft-cli"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Jeffrey Parke and the LedgerCraft contributors"]
repository = "https://github.com/TheRingmaster1/ledgercraft"
homepage = "https://github.com/TheRingmaster1/ledgercraft"
keywords = ["accounting", "bookkeeping", "ledger", "invoicing", "small-business"]
categories = ["finance"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# eframe 0.37 draws with wgpu by default (glow, whose Windows OpenGL path crashed
# under glutin 0.32, is now opt-in) and hints fonts (skrifa + vello_cpu, since 0.34).
eframe = "0.37"
rfd = "0.17"
# Writes formatted .xlsx report exports. MIT OR Apache-2.0, like LedgerCraft.
rust_xlsxwriter = "0.100"
# Zlib for logos in PDFs: decodes PNG files and compresses their pixels.
# MIT OR Zlib OR Apache-2.0; already in the dependency tree through eframe.
miniz_oxide = "0.8"
# Decodes a chosen logo to show it in Company Information. Already in the
# build through eframe; JPEG support is added. MIT OR Apache-2.0.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

ledgercraft-core = { path = "crates/core" }
ledgercraft-ledger = { path = "crates/ledger" }
ledgercraft-reports = { path = "crates/reports" }
ledgercraft-file = { path = "crates/file" }
ledgercraft-engine = { path = "crates/engine" }
ledgercraft-ui-egui = { path = "crates/ui-egui" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

# Key derivation is deliberately expensive; unoptimised it takes seconds, so
# build the crypto crates optimised even in debug builds and tests.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
# The password strength estimate runs as you type.
[profile.dev.package.zxcvbn]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
